default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npm run format:check
        language: system
        pass_filenames: false
      - id: html-validate
        name: HTML validation
        entry: npm run validate
        language: system
        pass_filenames: false
        files: \.html$
