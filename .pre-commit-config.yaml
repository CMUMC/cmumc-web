default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

# HTML validation needs a Jekyll build, so it runs in CI (npm run build, then
# npm run validate), not on every commit
repos:
  - repo: local
    hooks:
      - id: prettier
        name: Prettier
        entry: npm run format:check
        language: system
        pass_filenames: false
